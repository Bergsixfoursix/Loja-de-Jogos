  <meta charset="UTF-8">

</head>
<body class="bg-dark text-white">
<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Gamezone</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
  <ul class="navbar-nav me-auto">
    <li class="nav-item"><a class="nav-link" href="index.html">Loja</a></li>
    <li class="nav-item"><a class="nav-link" href="categorias.html">Categorias</a></li>
    <li class="nav-item"><a class="nav-link" href="carinho.html">Carrinho <span class="badge bg-danger rounded-pill" id="cart-count">0</span></a></li>
  </ul>
  <div class="navbar-nav">
    <a class="nav-link" href="pedido.html" onclick="abrirPedido(); return false;">Pedido</a>
    <a class="nav-link" href="conta.html">Conta</a>
  </div>
</div>
    </div>
  </nav>
</header>
<!-- Seção do Carrinho -->
  <section id="carrinho" class="container my-5">
    <h2 class="mb-4 titulo-categorias">Meu Carrinho</h2>


    <div id="lista-carrinho">
      <p>Seu carrinho está vazio.</p>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
      <h4>
        Total: <span id="total-carrinho" class="text-warning">R$ 0,00</span>
      </h4>
      <button id="btn-ir-pagamento" class="btn btn-success btn-lg d-none" onclick="mostrarFormularioPagamento()">
        Prosseguir para o Pagamento
      </button>

      <button id="btn-limpar-carrinho"
              class="btn btn-danger btn-lg d-none"
              data-bs-toggle="modal"
              data-bs-target="#modalLimparCarrinho">
       Limpar Carrinho
      </button>
      
    </div>
  </section>

  <!-- Janela de confirmação para limpar o carrinho -->
<div class="modal fade" id="modalLimparCarrinho" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white">

      <div class="modal-header">
        <h5 class="modal-title">Limpar Carrinho</h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        Deseja realmente remover todos os jogos do carrinho?
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cancelar
        </button>

        <button type="button" class="btn btn-danger"
                onclick="limparCarrinho()"
                data-bs-dismiss="modal">
          Limpar Carrinho
        </button>
      </div>

    </div>
  </div>
</div>
